name: Backup freshness

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      scheduled_at_override:
        description: "Optional fixture timestamp for safely exercising stale logic"
        required: false
        type: string
      now_override:
        description: "Optional fixture clock paired with scheduled_at_override"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check snapshot and maintain the one stale issue
        uses: actions/github-script@v7
        env:
          SCHEDULED_AT_OVERRIDE: ${{ inputs.scheduled_at_override }}
          NOW_OVERRIDE: ${{ inputs.now_override }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const staleTitle = "backup stale";
            const maxAgeMs = 36 * 60 * 60 * 1000;

            let scheduledAt = process.env.SCHEDULED_AT_OVERRIDE || "";
            let problem = "";

            if (!scheduledAt) {
              try {
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/contents/{path}",
                  {
                    owner,
                    repo,
                    path: "snapshot.json",
                    headers: { accept: "application/vnd.github.raw+json" },
                  },
                );
                const raw = typeof response.data === "string"
                  ? response.data
                  : Buffer.from(response.data).toString("utf8");
                const snapshot = JSON.parse(raw);
                if (typeof snapshot.scheduled_at !== "string") {
                  problem = "snapshot.json has no scheduled_at timestamp";
                } else {
                  scheduledAt = snapshot.scheduled_at;
                }
              } catch (error) {
                problem = error.status === 404
                  ? "snapshot.json is missing"
                  : `snapshot.json could not be read: ${error.message}`;
              }
            }

            const now = new Date(process.env.NOW_OVERRIDE || Date.now());
            if (!problem) {
              const scheduled = Date.parse(scheduledAt);
              if (!Number.isFinite(scheduled)) {
                problem = `snapshot.json has an invalid scheduled_at timestamp: ${scheduledAt}`;
              } else {
                const ageMs = now.getTime() - scheduled;
                if (ageMs > maxAgeMs) {
                  problem = `latest scheduled backup is ${Math.floor(ageMs / 3600000)}h old (${scheduledAt})`;
                }
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const staleIssues = issues.filter(
              (issue) => !issue.pull_request && issue.title === staleTitle,
            );

            if (problem) {
              if (staleIssues.length === 0) {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: staleTitle,
                  body: `The independent backup watchdog failed at ${now.toISOString()}.\n\n${problem}`,
                });
              }
              core.setFailed(problem);
              return;
            }

            for (const issue of staleIssues) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

            core.info(`backup is fresh: ${scheduledAt}`);
