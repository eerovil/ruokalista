name: Cron observability probe

on:
  push:
    branches: [chatgpt/issue-64-cron-api-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Query Worker invocation telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          from=$(date -u -d '2026-08-25T18:00:00Z' +%s000)
          to=$(date -u +%s000)
          body=$(jq -n \
            --argjson from "$from" \
            --argjson to "$to" \
            '{queryId:"issue-64-cron-probe", timeframe:{from:$from,to:$to}, view:"events", limit:200, dry:true, parameters:{datasets:[], filterCombination:"and", filters:[{key:"$metadata.service",operation:"eq",type:"string",value:"ruokalista"}]}}')
          response=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body")

          # Print only non-sensitive invocation metadata relevant to scheduled events.
          echo "$response" | jq '{success, errors, result: {count: (.result.events.count // 0), events: [(.result.events.events // [])[] | {timestamp, metadata: {service: ."$metadata".service, origin: ."$metadata".origin, trigger: ."$metadata".trigger, message: ."$metadata".message, level: ."$metadata".level}, workers: {eventType: ."$workers".eventType, scriptName: ."$workers".scriptName, outcome: ."$workers".outcome}}]}}'
          echo "$response" | jq -e '.success == true' >/dev/null
