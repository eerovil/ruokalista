name: Watchdog acceptance fixture

on: push

permissions:
  contents: read
  issues: write

jobs:
  fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise fresh fixture
        uses: actions/github-script@v7
        with:
          script: |
            const staleTitle = "backup stale";
            const scheduledAt = "2026-08-25T23:30:49.000Z";
            const now = new Date("2026-08-26T00:00:00.000Z");
            const maxAgeMs = 36 * 60 * 60 * 1000;
            const ageMs = now.getTime() - Date.parse(scheduledAt);
            if (ageMs > maxAgeMs) {
              core.setFailed("fresh fixture unexpectedly became stale");
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const staleIssues = issues.filter(
              (issue) => !issue.pull_request && issue.title === staleTitle,
            );

            for (const issue of staleIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

            core.info(`backup is fresh: ${scheduledAt}`);
