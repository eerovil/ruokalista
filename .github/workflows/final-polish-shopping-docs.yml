name: Final-polish shopping client docs

on:
  push:
    branches:
      - docs/279-shopping-client-cleanup

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/final-polish-shopping-docs.mjs
      - name: Commit final polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/codebase/screens.md src/shopping-screens.ts .github/workflows/final-polish-shopping-docs.yml scripts/final-polish-shopping-docs.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Final-polish shopping client documentation"
          git push
