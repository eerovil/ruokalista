name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer PR push makes its older check pointless. A main run is different: once
# it may touch production it must finish, so main pushes queue instead of
# cancelling a migration between the schema and deploy steps.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # The same image scripts/playwright.sh uses, pinned to the same version as
    # the @playwright/test in package.json. It already carries the browsers;
    # installing them would need root for apt.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      # Nothing here should reach the network. No test calls Anthropic — the
      # streaming endpoint is stubbed — and wrangler runs in local mode.
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Checks
        run: npm run check

      - name: Local development values
        # Throwaway values. SESSION_SECRET signs the cookies the browser tests
        # mint; the Google pair only has to exist, because the sign-in tests
        # check the redirect that is built from it, never a real handshake.
        # ANTHROPIC_API_KEY is deliberately absent: if a test ever needs it, it
        # is calling the model, and that is a test that should not exist.
        run: |
          {
            printf 'SESSION_SECRET="%s"\n' "$(openssl rand -base64 32)"
            printf 'GOOGLE_CLIENT_ID="ci.apps.googleusercontent.com"\n'
            printf 'GOOGLE_CLIENT_SECRET="ci-not-a-real-secret"\n'
          } > .dev.vars

      - name: Migrate the local database
        run: npx wrangler d1 migrations apply ruokalista --local

      - name: Browser tests
        run: npx playwright test

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    # Only on main, and only once the tests have passed. A pull request never
    # reaches this job, so the token is never available to one — which is what
    # makes it safe to keep in a public repository's secrets.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest

    # Nothing else in this workflow should be able to see these.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply any new migrations
        # Before the deploy, not after: the migration is backward-compatible,
        # and main runs cannot now be cancelled before the matching deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ruokalista --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Check what is actually live
        # The deploy reporting success is not the same as the app answering.
        run: |
          set -e
          health=$(curl -fsS https://ruokalista.eerovil.workers.dev/health)
          echo "$health"
          case "$health" in
            *'"database":"ok"'*) ;;
            *) echo "live health is not ok"; exit 1 ;;
          esac
          signed_out=$(curl -s -o /dev/null -w '%{http_code}' \
            https://ruokalista.eerovil.workers.dev/recipes)
          [ "$signed_out" = "302" ] || { echo "screens not gated: $signed_out"; exit 1; }
