name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer PR push makes its older check pointless. A main run is different: once
# it may touch production it must finish, so main pushes queue instead of
# cancelling a migration between the schema and deploy steps.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # The restore round-trip decides whether it applies by diffing against
          # this pull request's base, so the base commit has to be here.
          fetch-depth: 0
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Local development values
        run: |
          {
            printf 'SESSION_SECRET="%s"\n' "$(openssl rand -base64 32)"
            printf 'GOOGLE_CLIENT_ID="ci.apps.googleusercontent.com"\n'
            printf 'GOOGLE_CLIENT_SECRET="ci-not-a-real-secret"\n'
          } > .dev.vars
      - name: Migrate the local database
        run: npx wrangler d1 migrations apply ruokalista --local
      - name: Check backup schema coverage
        run: npm run check:backup-schema
      # The drill costs minutes where the rest of this tier costs seconds, and it
      # can only say something when the schema, the backup format, the restore
      # path or their fixtures moved. On a push to main it always runs: that is
      # the run that migrates the live database and then deploys.
      - name: Decide whether the restore round-trip applies
        id: roundtrip
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "always runs outside a pull request"
            exit 0
          fi
          # If the diff cannot be worked out, run the drill. The expensive
          # answer is the safe one; skipping on a broken diff is not.
          if ! changed=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD); then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "could not diff against the base, so running it"
            exit 0
          fi
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(migrations/|src/backup\.ts$|src/restore\.ts$|dev/check-backup\.ts$|dev/check-restore\.ts$|dev/seed\.sql$|scripts/check-restore-roundtrip\.ts$|scripts/check-backup-schema\.ts$|package\.json$|\.github/workflows/ci\.yml$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "no schema, backup or restore path changed"
          fi
      - name: Restore round-trip
        if: steps.roundtrip.outputs.needed == 'true'
        run: npm run check:restore-roundtrip
      # Every behavioural spec, on every pull request — this is the gate.
      # tests/screenshots.spec.ts still runs its flows and assertions; only its
      # review-artifact writes are opt-in.
      - name: Browser tests
        run: npx playwright test
      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply any new migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ruokalista --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check what is actually live
        run: |
          set -e
          health=$(curl -fsS https://ruokalista.eerovil.workers.dev/health)
          echo "$health"
          case "$health" in
            *'"database":"ok"'*) ;;
            *) echo "live health is not ok"; exit 1 ;;
          esac
          signed_out=$(curl -s -o /dev/null -w '%{http_code}' \
            https://ruokalista.eerovil.workers.dev/recipes)
          [ "$signed_out" = "302" ] || { echo "screens not gated: $signed_out"; exit 1; }
