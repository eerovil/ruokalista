name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer PR push makes its older check pointless. A main run is different: once
# it may touch production it must finish, so main pushes queue instead of
# cancelling a migration between the schema and deploy steps.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Local development values
        run: |
          {
            printf 'SESSION_SECRET="%s"\n' "$(openssl rand -base64 32)"
            printf 'GOOGLE_CLIENT_ID="ci.apps.googleusercontent.com"\n'
            printf 'GOOGLE_CLIENT_SECRET="ci-not-a-real-secret"\n'
          } > .dev.vars
      - name: Migrate the local database
        run: npx wrangler d1 migrations apply ruokalista --local
      - name: Check backup schema coverage
        run: npm run check:backup-schema
      - name: Restore round-trip
        run: npm run check:restore-roundtrip
      - name: Browser tests
        run: npx playwright test
      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply any new migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ruokalista --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check what is actually live
        run: |
          set -e
          health=$(curl -fsS https://ruokalista.eerovil.workers.dev/health)
          echo "$health"
          case "$health" in
            *'"database":"ok"'*) ;;
            *) echo "live health is not ok"; exit 1 ;;
          esac
          signed_out=$(curl -s -o /dev/null -w '%{http_code}' \
            https://ruokalista.eerovil.workers.dev/recipes)
          [ "$signed_out" = "302" ] || { echo "screens not gated: $signed_out"; exit 1; }
