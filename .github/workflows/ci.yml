name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "build/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Seed local D1
        run: npm run db:seed:local

      - name: Smoke-check local D1
        run: npm run db:smoke:local
