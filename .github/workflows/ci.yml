name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer PR push makes its older check pointless. A main run is different: once
# it may touch production it must finish, so main pushes queue instead of
# cancelling a migration between the schema and deploy steps.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Local development values
        run: |
          {
            printf 'SESSION_SECRET="%s"\n' "$(openssl rand -base64 32)"
            printf 'GOOGLE_CLIENT_ID="ci.apps.googleusercontent.com"\n'
            printf 'GOOGLE_CLIENT_SECRET="ci-not-a-real-secret"\n'
          } > .dev.vars
      - name: Migrate the local database
        run: npx wrangler d1 migrations apply ruokalista --local
      - name: Check backup schema coverage
        run: npm run check:backup-schema
      - name: Restore round-trip
        run: npm run check:restore-roundtrip
      - name: Browser tests
        run: npx playwright test
      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply any new migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ruokalista --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check what is actually live
        run: |
          set -e
          health=$(curl -fsS https://ruokalista.eerovil.workers.dev/health)
          echo "$health"
          case "$health" in
            *'"database":"ok"'*) ;;
            *) echo "live health is not ok"; exit 1 ;;
          esac
          signed_out=$(curl -s -o /dev/null -w '%{http_code}' \
            https://ruokalista.eerovil.workers.dev/recipes)
          [ "$signed_out" = "302" ] || { echo "screens not gated: $signed_out"; exit 1; }
      - name: Observe authentic Cron Trigger backup
        if: contains(github.event.head_commit.message, '[cron-diagnostic]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          tail_pid=""
          cleanup() {
            if [ -n "$tail_pid" ]; then
              kill "$tail_pid" 2>/dev/null || true
              wait "$tail_pid" 2>/dev/null || true
            fi
            rm -f "$log"
          }
          trap cleanup EXIT

          npx wrangler tail ruokalista --format json --search backup >"$log" 2>&1 &
          tail_pid=$!

          # Trigger changes can take up to 15 minutes to propagate. With the
          # temporary */5 schedule, 25 minutes covers propagation plus two
          # five-minute boundaries without another deploy or secret mutation.
          for _ in $(seq 1 300); do
            if grep -q 'backup.scheduled_failed' "$log"; then
              cat "$log"
              echo "scheduled backup invocation failed"
              exit 1
            fi
            if grep -q 'backup.completed' "$log"; then
              cat "$log"
              echo "observed successful authentic Cron Trigger backup"
              exit 0
            fi
            if ! kill -0 "$tail_pid" 2>/dev/null; then
              cat "$log"
              echo "wrangler tail exited before observing the Cron Trigger"
              exit 1
            fi
            sleep 5
          done

          cat "$log"
          echo "no authentic Cron Trigger backup observed within 25 minutes"
          exit 1
