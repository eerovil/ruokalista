name: Fix shopping comment indent

on:
  push:
    branches:
      - docs/279-shopping-client-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-shopping-comment-indent.mjs
      - name: Commit indentation fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shopping-screens.ts .github/workflows/fix-shopping-comment-indent.yml scripts/fix-shopping-comment-indent.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix shopping client comment indentation"
          git push
